<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/style.css}"><title>Учебный кабинет</title></head><body><header><strong>Учебный кабинет</strong><nav><a th:href="@{/index}">Главная</a><a th:href="@{/list}">Студенты</a><a th:href="@{/groups}">Группы</a><a th:href="@{/users}">Пользователи</a><a th:href="@{/login}">Вход</a><a th:href="@{/register}">Регистрация</a></nav><form method="post" th:action="@{/logout}"><button>Выйти</button></form></header><main><h1>Вход</h1><p class="error" th:if="${param.error}">Неверный email или пароль.</p><p class="success" th:if="${param.logout}">Вы вышли из системы.</p><form class="editor" method="post" th:action="@{/login}"><label>Email<input name="username" type="email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Войти</button><p><a th:href="@{/register}">Создать учетную запись</a></p></form></main></body></html>
