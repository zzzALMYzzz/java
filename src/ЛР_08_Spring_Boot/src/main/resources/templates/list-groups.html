<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/style.css}"><title>Учебный кабинет</title></head><body><header><strong>Учебный кабинет</strong><nav><a th:href="@{/index}">Главная</a><a th:href="@{/list}">Студенты</a><a th:href="@{/groups}">Группы</a><a th:href="@{/users}">Пользователи</a><a th:href="@{/login}">Вход</a><a th:href="@{/register}">Регистрация</a></nav><form method="post" th:action="@{/logout}"><button>Выйти</button></form></header><main><h1>Учебные группы</h1><a class="button" th:href="@{/addGroupForm}">Добавить</a><p th:if="${#lists.isEmpty(groups)}">Пока нет записей. Добавьте первую.</p><table><thead><tr><th>Группа</th><th>Факультет</th><th>Курс</th><th>Действия</th></tr></thead><tbody><tr th:each="item : ${groups}"><td th:text="${item.name}"></td><td th:text="${item.faculty}"></td><td th:text="${item.course}"></td><td class="actions"><a th:href="@{/showGroupUpdateForm(groupId=${item.id})}">Изменить</a><form method="post" th:action="@{/deleteGroup}"><input type="hidden" name="groupId" th:value="${item.id}"><button class="danger">Удалить</button></form></td></tr></tbody></table></main></body></html>
