<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/style.css}"><title>Учебный кабинет</title></head><body><header><strong>Учебный кабинет</strong><nav><a th:href="@{/index}">Главная</a><a th:href="@{/list}">Студенты</a><a th:href="@{/groups}">Группы</a><a th:href="@{/users}">Пользователи</a><a th:href="@{/login}">Вход</a><a th:href="@{/register}">Регистрация</a></nav><form method="post" th:action="@{/logout}"><button>Выйти</button></form></header><main><h1>Регистрация</h1><p class="success" th:if="${param.success}">Учетная запись создана. Теперь можно войти.</p><form class="editor" method="post" th:action="@{/register/save}" th:object="${user}"><p class="error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p><label>Имя<input type="text" th:field="*{firstName}" required></label><p class="error" th:errors="*{firstName}"></p><label>Фамилия<input type="text" th:field="*{lastName}" required></label><p class="error" th:errors="*{lastName}"></p><label>Email<input type="email" th:field="*{email}" required></label><p class="error" th:errors="*{email}"></p><label>Пароль (от 8 символов)<input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><p class="error" th:errors="*{password}"></p><button>Зарегистрироваться</button></form></main></body></html>
