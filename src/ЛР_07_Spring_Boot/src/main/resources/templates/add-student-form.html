<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/style.css}"><title>Учебный кабинет</title></head><body><header><strong>Учебный кабинет</strong><nav><a th:href="@{/index}">Главная</a><a th:href="@{/list}">Студенты</a><a th:href="@{/groups}">Группы</a><a th:href="@{/users}">Пользователи</a><a th:href="@{/login}">Вход</a><a th:href="@{/register}">Регистрация</a></nav></header><main><h1>Студенты: запись</h1><form class="editor" method="post" th:action="@{/saveStudent}" th:object="${student}"><input type="hidden" th:field="*{id}"><label>Имя<input type="text" th:field="*{name}" required></label><p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p><label>Фамилия<input type="text" th:field="*{surname}" required></label><p class="error" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></p><label>Факультет<input type="text" th:field="*{faculty}" required></label><p class="error" th:if="${#fields.hasErrors('faculty')}" th:errors="*{faculty}"></p><label>Возраст<input type="number" th:field="*{age}" required></label><p class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p><button>Сохранить</button><a th:href="@{/list}">Отмена</a></form></main></body></html>
